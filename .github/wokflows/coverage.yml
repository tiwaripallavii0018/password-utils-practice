name: Coverage Check

on:
  pull_request:
    branches:
      - main

jobs:
  coverage:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Coverage
        run: |
          PYTHONPATH=. pytest --cov=src --cov-report=term-missing --cov-fail-under=90