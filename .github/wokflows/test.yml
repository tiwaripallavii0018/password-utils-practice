name: Python Tests

on:
  push:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout

        uses: actions/checkout@v3

      - name: Setup Python

        uses: actions/setup-python@v3

        with:

          python-version: "3.10"

      - name: Install Packages

        run: |

          pip install pytest

      - name: Run Tests

        run: |

          pytest